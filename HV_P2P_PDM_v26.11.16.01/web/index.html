<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HV P2P PDM v26.11.16.01</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0f1316;
      --panel: #171c20;
      --border: #4a4f52;
      --foreground: #f0f2f1;
      --muted: #aeb4b1;
      --cyan: #26d5ff;
      --green: #63d84e;
      --amber: #e7c94a;
      --red: #ef5757;
      --font: "Helvetica Neue", Arial, sans-serif;
      background: var(--background);
      color: var(--foreground);
      font: 14px var(--font);
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    main {
      display: grid;
      grid-template-rows: 32px auto minmax(359px, 1fr) auto;
      gap: 8px;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px;
    }
    h1, p { margin: 0; }
    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      min-width: 84px;
      padding: 0 10px;
      color: #ecefee;
      background: #1a2024;
      border: 1px solid #596064;
      border-radius: 4px;
      font: 14px var(--font);
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .button:hover { background: #22282c; }
    .button:active { background: #263129; }
    .button:focus-visible, .channel-name:focus-visible, summary:focus-visible {
      outline: 1px solid var(--cyan);
      outline-offset: 2px;
    }
    .button:disabled {
      color: #697074;
      background: #15191c;
      cursor: default;
    }
    .section-tab {
      width: 78px;
      min-width: 78px;
      height: 32px;
      color: #f5f7f6;
      background: #1e3524;
      border-color: var(--green);
    }
    .section-tab:hover { background: #263129; }
    .status-panel { display: grid; gap: 6px; padding: 9px; }
    .status-top, .status-bottom, .title-group, .status-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-top { justify-content: space-between; flex-wrap: wrap; }
    .title-group { min-width: 0; }
    .status-actions { margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
    h1 { color: var(--cyan); font-size: 19px; font-weight: 500; }
    .connection { color: var(--muted); white-space: nowrap; }
    .connection[data-state="live"] { color: var(--green); }
    .connection[data-state="stale"] { color: var(--amber); }
    .status-bottom, .extrema, .history { color: var(--muted); font-size: 13px; }
    .status-bottom { flex-wrap: wrap; min-height: 15px; }
    #firmware { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sample-time { text-align: right; }
    .firmware-progress { color: var(--cyan); }
    progress { width: 110px; height: 12px; accent-color: var(--cyan); }
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .channel {
      display: flex;
      flex-direction: column;
      min-height: 175px;
      padding: 11px;
      gap: 4px;
    }
    .channel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .channel-name {
      overflow: hidden;
      padding: 0;
      color: var(--cyan);
      background: none;
      border: 0;
      font: 500 18px var(--font);
      cursor: pointer;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .channel-name:disabled { cursor: default; }
    .channel-settings {
      min-width: 80px;
      min-height: 27px;
      font-size: 13px;
    }
    .channel-readout { display: flex; align-items: center; gap: 8px; }
    .alarm { color: var(--red); font-size: 13px; }
    .live { font-size: 18px; font-weight: 500; white-space: nowrap; }
    .trace { position: relative; flex: 1; min-width: 0; min-height: 108px; }
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; }
    .trace-marker, .trace-readout { position: absolute; pointer-events: none; }
    .trace-marker {
      width: 7px;
      height: 7px;
      background: var(--cyan);
      border: 1px solid var(--background);
      border-radius: 50%;
    }
    .trace-readout {
      padding: 4px 7px;
      border: 1px solid #596064;
      border-radius: 4px;
      background: var(--panel);
      color: var(--foreground);
      font-size: 12px;
      white-space: nowrap;
    }
    .history { min-height: 16px; }
    dialog {
      width: min(calc(100% - 32px), 380px);
      max-height: calc(100% - 24px);
      overflow: auto;
      padding: 16px;
      color: var(--muted);
      font: 14px var(--font);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
    .channel-dialog { width: min(calc(100% - 32px), 400px); }
    dialog h2 { margin: 0 0 10px; color: var(--cyan); font-size: 19px; font-weight: 500; }
    .fields { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 9px 12px; }
    input, select {
      width: 148px;
      max-width: 100%;
      min-height: 31px;
      padding: 4px 8px;
      background: #101518;
      color: var(--foreground);
      border: 1px solid var(--border);
      border-radius: 4px;
      font: inherit;
    }
    input:focus, select:focus { outline: none; border-color: var(--cyan); }
    input[readonly] { cursor: text; }
    .fields input[type="number"], .fields select { width: 120px; }
    #channel-name { width: 175px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
    .hint, .dialog-status { margin-top: 10px; line-height: 1.35; }
    .dialog-status:empty { display: none; }
    .dialog-status[data-error="true"] { color: var(--red); }
    details { margin-top: 10px; }
    summary { cursor: pointer; }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .demo-choice { display: flex; align-items: center; margin-top: 8px; gap: 6px; }
    .demo-choice input { width: auto; min-height: 0; accent-color: var(--green); }
    .toast {
      position: fixed;
      bottom: 14px;
      left: 12px;
      max-width: min(630px, calc(100% - 24px));
      padding: 9px 12px;
      line-height: 1.35;
    }
    @media (max-width: 730px) {
      main { grid-template-rows: 32px auto auto auto; padding: 8px; }
      .channel-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
      .channel { min-height: 220px; }
      .status-top, .status-actions { gap: 8px; }
      .status-actions { margin-left: 0; justify-content: flex-start; }
      .status-actions .button { min-width: 0; }
      #firmware { flex-basis: 100%; }
      .sample-time { margin-left: auto; }
    }
    @media (max-width: 395px) {
      .status-actions .button { padding: 0 8px; font-size: 13px; }
      h1 { font-size: 17px; }
      .fields { grid-template-columns: minmax(0, 1fr) minmax(110px, 1fr); gap: 8px; }
    }
  </style>
  <script src="/pdm.js?v=26.11.16.01" defer></script>
</head>
<body>
  <main aria-label="PDM Monitoring">
    <nav aria-label="Monitoring">
      <a class="button section-tab" href="/" aria-current="page">PDM</a>
    </nav>
    <section class="panel status-panel" aria-labelledby="pdm-title">
      <div class="status-top">
        <div class="title-group">
          <h1 id="pdm-title">Power Distribution Module</h1>
          <span id="status-text" class="connection" role="status">Connecting</span>
        </div>
        <div class="status-actions">
          <button type="button" class="button" id="btn-lan-settings">LAN Settings</button>
          <button type="button" class="button" id="btn-wifi-settings">Wifi Settings</button>
          <a class="button" id="btn-open-web" href="/" target="_blank" rel="noopener">Web UI</a>
          <button type="button" class="button" id="btn-log-settings">Settings</button>
        </div>
      </div>
      <div class="status-bottom">
        <span id="firmware">Firmware —</span>
        <progress id="progress" max="100" value="0" aria-label="Firmware update progress" hidden></progress>
        <span id="progress-text" class="firmware-progress" hidden></span>
        <span id="sample-time" class="sample-time">Waiting for samples</span>
      </div>
    </section>
    <div class="channel-grid" id="channels"></div>
    <p class="history" id="history-status">Waiting for PDM</p>
  </main>

  <template id="channel-template">
    <article class="panel channel">
      <div class="channel-row">
        <button type="button" class="channel-name" disabled></button>
        <button type="button" class="button channel-settings" disabled>Settings</button>
      </div>
      <div class="channel-row">
        <span class="extrema">Min — V  •  Max — V</span>
        <div class="channel-readout">
          <span class="alarm" hidden></span>
          <span class="live">Live — V</span>
        </div>
      </div>
      <div class="trace">
        <canvas></canvas>
        <span class="trace-marker" aria-hidden="true" hidden></span>
        <span class="trace-readout" hidden></span>
      </div>
    </article>
  </template>

  <dialog class="panel" id="lan-modal" aria-labelledby="lan-title">
    <h2 id="lan-title">LAN Settings</h2>
    <div class="fields">
      <label for="lan-ip-mode">IP Mode</label>
      <select id="lan-ip-mode">
        <option value="DHCP">DHCP</option>
        <option value="Static">Static IP</option>
      </select>
      <label for="lan-ip">IP Address</label><input id="lan-ip" maxlength="15">
      <label for="lan-subnet">Subnet</label><input id="lan-subnet" maxlength="15">
      <label for="lan-gateway">Gateway</label><input id="lan-gateway" maxlength="15">
    </div>
    <p class="dialog-status" role="status"></p>
    <div class="actions">
      <button type="button" class="button" id="lan-save">Apply</button>
      <button type="button" class="button" data-close-modal="lan-modal">Cancel</button>
    </div>
  </dialog>

  <dialog class="panel" id="wifi-modal" aria-labelledby="wifi-title">
    <h2 id="wifi-title">Wifi Settings</h2>
    <div class="fields">
      <label for="wifi-mode">Wifi Mode</label>
      <select id="wifi-mode"><option value="AP">Access Point</option></select>
      <label for="wifi-ip-mode">IP Mode</label>
      <select id="wifi-ip-mode"><option value="Static">Static IP</option></select>
      <label for="wifi-ssid">SSID</label><input id="wifi-ssid" autocomplete="off">
      <label for="wifi-password">Password</label><input id="wifi-password" type="password" autocomplete="off">
      <label for="wifi-ip">IP Address</label><input id="wifi-ip" maxlength="15">
      <label for="wifi-subnet">Subnet</label><input id="wifi-subnet" maxlength="15">
      <label for="wifi-gateway">Gateway</label><input id="wifi-gateway" maxlength="15">
    </div>
    <p class="dialog-status" role="status"></p>
    <div class="actions">
      <button type="button" class="button" id="wifi-save">Apply</button>
      <button type="button" class="button" data-close-modal="wifi-modal">Cancel</button>
    </div>
  </dialog>

  <dialog class="panel" id="log-modal" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <div class="fields">
      <label for="monitor-ip">IP Address</label><input id="monitor-ip" readonly>
      <label for="log-interval">Log Interval</label>
      <select id="log-interval">
        <option value="250">0.25 s</option><option value="500">0.5 s</option>
        <option value="1000">1.0 s</option><option value="2000">2.0 s</option>
      </select>
      <label for="log-hours">Log Duration</label>
      <select id="log-hours">
        <option value="1">1 h</option><option value="2">2 h</option><option value="3">3 h</option>
        <option value="4">4 h</option><option value="5">5 h</option><option value="6">6 h</option>
        <option value="7">7 h</option><option value="8">8 h</option><option value="9">9 h</option>
        <option value="10">10 h</option><option value="11">11 h</option><option value="12">12 h</option>
      </select>
    </div>
    <details>
      <summary>Tools</summary>
      <div class="tools">
        <button type="button" class="button" id="btn-export-csv">Export CSV</button>
        <button type="button" class="button" id="btn-self-test">Self Test</button>
        <button type="button" class="button" id="btn-refresh">Refresh</button>
        <button type="button" class="button" id="btn-reset">Reset View</button>
      </div>
      <label class="demo-choice"><input type="checkbox" id="demo-mode-toggle"> Demo Mode</label>
    </details>
    <p class="dialog-status" role="status"></p>
    <div class="actions">
      <button type="button" class="button" id="log-save">Apply</button>
      <button type="button" class="button" data-close-modal="log-modal">Cancel</button>
    </div>
  </dialog>

  <dialog class="panel channel-dialog" id="channel-settings-modal" aria-labelledby="channel-settings-title">
    <h2 id="channel-settings-title">Channel Settings</h2>
    <div class="fields">
      <label for="channel-name">Channel Name</label><input id="channel-name">
      <label for="modal-low">Low Voltage Alarm</label><input id="modal-low" type="number" step="any">
      <label for="modal-high">High Voltage Alarm</label><input id="modal-high" type="number" step="any">
      <label for="modal-actual">Actual Voltage</label><input id="modal-actual" type="number" step="any">
    </div>
    <p class="hint">Enter the voltage measured at this channel. Clear Actual Voltage to reset its calibration.</p>
    <p class="dialog-status" role="status"></p>
    <div class="actions">
      <button type="button" class="button" id="channel-settings-save">Apply</button>
      <button type="button" class="button" data-close-modal="channel-settings-modal">Cancel</button>
    </div>
  </dialog>

  <p id="toast" class="panel toast" role="status" hidden></p>
</body>
</html>
