name: HV P2P Firmware Build v26.08.31.04

on:
  workflow_dispatch:
  push:
    paths:
      - 'HV_P2P_CTRL_EDGEBOX_v26.08.31.04/**'
      - 'HV_P2P_CTRL_TS_v26.08.31.04/**'
      - 'HV_P2P_W1P_EDGEBOX_v26.08.31.04/**'
      - 'tools/**'
      - '.github/workflows/firmware-build.yml'

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'

      - name: Install ESP32 Arduino core 3.3.8
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.8
          arduino-cli core list
          arduino-cli board listall | grep -E 'Edgebox-ESP-100|ESP32S3 Dev Module'

      - name: Install pinned CTRL-TS libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install 'lvgl@8.3.11'
          arduino-cli lib install 'ESP32_Display_Panel@0.1.6'
          arduino-cli lib install 'ESP32_IO_Expander@0.0.3'
          arduino-cli lib install 'JPEGDEC@1.8.4'
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/iamfaraz/Waveshare_ST7262_LVGL.git "$HOME/Arduino/libraries/Waveshare_ST7262_LVGL"
          python3 tools/prepare_lvgl_config.py --libraries-dir "$HOME/Arduino/libraries"
          test -f "$HOME/Arduino/libraries/lv_conf.h"
          grep -F '#define LV_TICK_CUSTOM 1' "$HOME/Arduino/libraries/lv_conf.h"
          grep -F '#define LV_FONT_MONTSERRAT_24 1' "$HOME/Arduino/libraries/lv_conf.h"
          arduino-cli lib list

      - name: Source/protocol regression suite
        run: python3 tools/run_all_source_checks.py

      - name: Native build CTRL-TS -> embed -> CTRL -> W1P
        run: python3 tools/native_build_firmware.py --output "$GITHUB_WORKSPACE/NATIVE_BUILD_ARTIFACTS"

      - name: Check that source CTRL still contains build guard
        run: |
          grep -F '#error "CTRL-TS firmware image has not been staged.' HV_P2P_CTRL_EDGEBOX_v26.08.31.04/HV_P2P_CTRL_TS_Firmware_Image.h

      - name: Upload functional-test firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: HV-P2P-v26.08.31.04-Native-Firmware
          path: NATIVE_BUILD_ARTIFACTS/
          if-no-files-found: error
          retention-days: 30
